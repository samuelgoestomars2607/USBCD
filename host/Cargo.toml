[package]
name = "usbcd"
version = "0.6.19"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Samuel E. Ramirez"]
description = "Windows-Begleitdienst: macht ein per USB angeschlossenes Android-Tablet zum zweiten Monitor mit Lautsprechern"

# camera/ = usbcd_cam.dll (virtuelle Webcam); „cargo build --release“ baut beides
[workspace]
members = ["camera"]
default-members = [".", "camera"]

[[bin]]
name = "USBCD"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
miniz_oxide = "0.8"
windows-targets = "0.52"
windows-sys = { version = "0.59", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_Display",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Pipes",
  "Win32_System_Power",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_Registry",
  "Win32_System_Services",
  "Win32_System_Threading",
  "Win32_Globalization",
  "Win32_Networking_WinHttp",
  "Win32_Security_Cryptography",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_UI_Controls",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
