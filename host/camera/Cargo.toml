[package]
name = "usbcd-cam"
version = "0.6.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Samuel E. Ramirez"]
description = "Virtuelle Windows-11-Kamera „USBCD Tablet-Kamera“ (Media-Foundation-Quelle für den Windows Camera Frame Server)"

[lib]
name = "usbcd_cam"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows-core = "0.61"
windows = { version = "0.61", features = [
  "Win32_Devices_Properties",
  "Win32_Foundation",
  "Win32_Media_KernelStreaming",
  "Win32_Media_MediaFoundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Variant",
] }
